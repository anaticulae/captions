[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "captions"
version = "1.0.1"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "configos>=1.0.4,<2.0.0",
    "elementae>=1.0.1,<2.0.0",
    "groupmes>=1.1.0,<2.0.0",
    "iamraw>=4.93.0,<5.0.0",
    "utilo>=2.109.1,<3.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "codero==1.0.1",
    "figureo==1.0.1",
    "gennex==1.1.0",
    "headnote==1.0.3",
    "hoverpower==1.5.2",
    "ibidem>=1.0.2,<2.0.0",
    "indagator==1.0.1",
    "jamer==1.0.2",
    "mundare==1.0.2",
    "pagenumber>=1.0.0,<2.0.0",
    "rawmaker==2.40.5",
    "tablero==1.0.1",
    "utilotest==1.0.5",
    "verbo==1.23.4",
]

[project.urls]
Homepage = "https://github.com/anaticulae/caption"
Repository = "https://github.com/anaticulae/caption"

[project.scripts]
caption = "caption.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "caption",
    "caption.feature",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
]
